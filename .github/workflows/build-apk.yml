name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          VERSION_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VERSION="$(echo "$VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Could not detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f1)"
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f2)"
          fi
          if ! echo "$MAJOR_VERSION" | grep -qE '^[0-9]+$'; then
            echo "ERROR: Could not parse Java major version from: $RAW_VERSION"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, found Java $MAJOR_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="$(command -v keytool)"
            fi
            if [ -z "$KEYTOOL_BIN" ]; then
              echo "ERROR: keytool not found in configured Java installation"
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "ERROR: Temporary ./debug.keystore could not be created"
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found or empty at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: $APK_PATH does not end with .apk"
              exit 1
              ;;
          esac
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "ERROR: Source APK missing or empty: $SRC_APK"
            exit 1
          fi
          STAGE_DIR="${RUNNER_TEMP}/namedrop-release-asset"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          DEST_APK="${STAGE_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to stage release asset at $DEST_APK"
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK release asset is missing or empty"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared release asset must have .apk extension"
              exit 1
              ;;
          esac
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Testing only (not a Play Store production release)
          - **Signing:** Signed only with a temporary debug keystore
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK_EXISTS="false"
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_EXISTS="true"
          fi

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "=== Release Verification ==="
            gh release view "$RELEASE_TAG"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Page URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** Debug APK Build #${GITHUB_RUN_NUMBER}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ "$APK_EXISTS" = "true" ]; then
              echo "APK build succeeded at app/build/outputs/apk/debug/app-debug.apk."
              echo "The normal Actions artifact named app-debug-apk remains available as a backup."
            else
              echo "APK build did not produce app/build/outputs/apk/debug/app-debug.apk."
            fi
            echo "Do NOT use the latest-release direct download link for this failed release attempt."

            {
              echo "### Release Publishing Warning"
              echo ""
              echo "GitHub Release publishing did not succeed for run ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})."
              if [ "$APK_EXISTS" = "true" ]; then
                echo "- Debug APK build succeeded and the backup Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
